# En este equipo, Java no puede crear el socket de dominio Unix que usa
# Selector.open() dentro del temporal por defecto, y el demonio de Gradle
# muere con "Unable to establish loopback connection". Apuntarlo a una ruta
# simple lo soluciona.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Djdk.net.unixdomain.tmpdir=C:\\Temp
android.useAndroidX=true
kotlin.code.style=official
