<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" role="img" aria-label="Leche pasteurizada">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2F6F3"/>
      <stop offset="1" stop-color="#DDE9E2"/>
    </linearGradient>
    <linearGradient id="bolsa" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EAF0EC"/>
    </linearGradient>
  </defs>
  <rect width="400" height="250" fill="url(#fondo)"/>
  <circle cx="75" cy="58" r="58" fill="#CFE0D5" opacity=".55"/>
  <ellipse cx="200" cy="210" rx="110" ry="13" fill="#173E32" opacity=".10"/>
  <!-- bolsa de leche -->
  <path d="M150 58 L250 58 L262 96 Q274 150 258 200 L142 200 Q126 150 138 96 Z" fill="url(#bolsa)"/>
  <path d="M150 58 L250 58 L246 70 L154 70 Z" fill="#DDE7E0"/>
  <!-- etiqueta -->
  <rect x="146" y="104" width="108" height="66" rx="10" fill="#356B50"/>
  <text x="200" y="134" text-anchor="middle" font-family="Georgia, serif" font-size="21" fill="#FFFFFF" font-weight="bold">Leche</text>
  <text x="200" y="154" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#E4C58A" letter-spacing="2">HUATA</text>
  <!-- gota -->
  <path d="M200 176 Q208 188 200 194 Q192 188 200 176 Z" fill="#FFFFFF" opacity=".9"/>
  <!-- vaso de leche -->
  <g transform="translate(300 150)">
    <path d="M-22 -34 L22 -34 L17 46 L-17 46 Z" fill="#FFFFFF" stroke="#CFE0D5" stroke-width="2"/>
    <path d="M-20 -18 L20 -18 L17 46 L-17 46 Z" fill="#FBFCFA"/>
    <path d="M-20 -18 Q-10 -24 0 -18 Q10 -12 20 -18" fill="none" stroke="#E6EEE9" stroke-width="2"/>
  </g>
</svg>
