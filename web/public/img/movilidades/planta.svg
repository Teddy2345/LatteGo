<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" role="img" aria-label="Planta lechera de Huata">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2F6F3"/>
      <stop offset="1" stop-color="#DDE9E2"/>
    </linearGradient>
    <linearGradient id="silo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D9E3DD"/>
    </linearGradient>
  </defs>
  <rect width="400" height="250" fill="url(#fondo)"/>
  <circle cx="62" cy="50" r="24" fill="#E4C58A" opacity=".45"/>
  <path d="M0 190 Q80 172 160 184 T320 180 T400 186 V250 H0 Z" fill="#E7EEE3"/>
  <ellipse cx="205" cy="208" rx="150" ry="10" fill="#173E32" opacity=".12"/>
  <!-- silo -->
  <rect x="280" y="92" width="46" height="112" rx="6" fill="url(#silo)" stroke="#C9D8CE" stroke-width="2"/>
  <path d="M280 98 Q303 62 326 98 Z" fill="#356B50"/>
  <g stroke="#C9D8CE" stroke-width="2">
    <line x1="280" y1="130" x2="326" y2="130"/>
    <line x1="280" y1="166" x2="326" y2="166"/>
  </g>
  <!-- edificio -->
  <rect x="92" y="112" width="176" height="92" fill="#FFFFFF" stroke="#C9D8CE" stroke-width="2"/>
  <path d="M80 114 L180 68 L280 114 Z" fill="#356B50"/>
  <rect x="140" y="92" width="80" height="16" rx="4" fill="#E4C58A"/>
  <text x="180" y="104" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" letter-spacing="2" fill="#173E32">PLANTA</text>
  <rect x="110" y="132" width="32" height="24" rx="3" fill="#DCEBEE"/>
  <rect x="218" y="132" width="32" height="24" rx="3" fill="#DCEBEE"/>
  <rect x="158" y="148" width="44" height="56" rx="3" fill="#173E32" opacity=".85"/>
  <line x1="180" y1="148" x2="180" y2="204" stroke="#FFFFFF" stroke-width="2" opacity=".25"/>
  <!-- porongos en la puerta -->
  <g stroke="#B9C8BE" stroke-width="1.5">
    <rect x="112" y="176" width="22" height="30" rx="5" fill="url(#silo)"/>
    <rect x="117" y="169" width="12" height="9" rx="2" fill="#EEF3EF"/>
    <rect x="226" y="176" width="22" height="30" rx="5" fill="url(#silo)"/>
    <rect x="231" y="169" width="12" height="9" rx="2" fill="#EEF3EF"/>
